<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Legumbrería</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🥦 La Legumbrería</h1>
    <nav>
      <button onclick="mostrarSeccion('venta')">Nueva venta</button>
      <button onclick="mostrarSeccion('inventario')">Inventario</button>
      <button onclick="mostrarSeccion('historial')">Historial</button>
    </nav>
  </header>

  <section id="venta">
    <h2>Nueva venta</h2>
    <div class="form-grupo">
      <label>Producto:</label>
      <select id="sel-producto"></select>
    </div>
    <div class="form-grupo">
      <label>Peso (kg) o cantidad:</label>
      <input type="number" id="inp-cantidad" placeholder="Ej: 0.5" step="0.01">
    </div>
    <button onclick="agregarAlCarrito()">Agregar al carrito</button>
    <h3>Carrito</h3>
    <ul id="lista-carrito"></ul>
    <p><strong>Total: $<span id="total">0</span></strong></p>
    <button onclick="confirmarVenta()">✅ Confirmar venta</button>
  </section>

  <section id="inventario" class="oculto">
    <h2>Inventario</h2>
    <div class="form-grupo">
      <label>Nombre:</label>
      <input type="text" id="inv-nombre" placeholder="Ej: Zanahoria">
    </div>
    <div class="form-grupo">
      <label>Precio por kg/unidad ($):</label>
      <input type="number" id="inv-precio" placeholder="Ej: 800">
    </div>
    <div class="form-grupo">
      <label>Stock:</label>
      <input type="number" id="inv-stock" placeholder="Ej: 20" step="0.1">
    </div>
    <button onclick="agregarProducto()">Agregar producto</button>
    <h3>Productos</h3>
    <ul id="lista-inventario"></ul>
  </section>

  <section id="historial" class="oculto">
    <h2>Historial de ventas</h2>
    <ul id="lista-historial"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
